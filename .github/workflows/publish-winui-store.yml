name: Prepare WinUI Store release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New Store version, e.g. 2.0.10.0 (unused for edit)'
        required: false
        type: string
      mode:
        description: 'Build, stage a package without submitting, or edit draft metadata'
        required: true
        type: choice
        default: build
        options:
          - build
          - upload
          - edit
          - submit
      submission_id:
        description: 'Exact PendingCommit submission ID; required for submit and never inferred'
        required: false
        type: string
      changes_file:
        description: 'Optional repo-relative edit-plan JSON from snapshot. No secrets.'
        required: false
        type: string
      release_content_file:
        description: 'Optional public release text JSON; preserves existing private notes. Cannot combine with changes_file.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: winui-store-release
  cancel-in-progress: false

jobs:
  package:
    if: inputs.mode == 'build' || inputs.mode == 'upload'
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build solution and inspect Store package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_VERSION)) { throw 'version is required for build/upload.' }
          $output = "$env:RUNNER_TEMP/WinUIStore"
          ./scripts/Build-WinUIStorePackage.ps1 -Version $env:RELEASE_VERSION -OutputDirectory $output
          $packages = @(Get-ChildItem $output -Recurse -File | Where-Object { $_.Extension -in '.msixupload', '.appxupload' })
          if ($packages.Count -ne 1) { throw 'Expected exactly one Store upload package.' }
          python scripts/winui_store_package.py --package $packages[0].FullName --version $env:RELEASE_VERSION --output "$output/package-inspection.json"
          if ($LASTEXITCODE -ne 0) { throw 'Store package inspection failed.' }
          "Package built from $env:GITHUB_SHA. Download winui-store-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT from this run's Artifacts section." >> $env:GITHUB_STEP_SUMMARY
      - name: Retain packages, provenance, and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winui-store-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/WinUIStore/
          if-no-files-found: error
          retention-days: 14

  stage-draft:
    # An edit deliberately skips package; upload requires its successful result.
    if: ${{ !cancelled() && (inputs.mode == 'edit' || inputs.mode == 'submit' || (inputs.mode == 'upload' && needs.package.result == 'success')) }}
    needs: package
    runs-on: windows-latest
    timeout-minutes: 30
    environment: microsoft-store
    defaults:
      run:
        shell: pwsh
    env:
      AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
      AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
      AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
      STORE_PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_MODE: ${{ inputs.mode }}
      CHANGES_FILE: ${{ inputs.changes_file }}
      RELEASE_CONTENT_FILE: ${{ inputs.release_content_file }}
      SUBMISSION_ID: ${{ inputs.submission_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        if: inputs.mode == 'upload'
        with:
          name: winui-store-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/store-package
      - name: Preserve draft and stage changes (no certification submission)
        run: |
          $scriptCommand = if ($env:RELEASE_MODE -eq 'submit') { 'commit' } else { $env:RELEASE_MODE }
          $arguments = @('scripts/winui_store_draft.py', $scriptCommand, '--output', "$env:RUNNER_TEMP/store-draft")
          if ($env:RELEASE_MODE -eq 'upload') {
            $packages = @(Get-ChildItem "$env:RUNNER_TEMP/store-package" -Recurse -File | Where-Object { $_.Extension -in '.msixupload', '.appxupload' })
            if ($packages.Count -ne 1) { throw 'Expected exactly one Store upload package.' }
            $arguments += @('--package', $packages[0].FullName, '--version', $env:RELEASE_VERSION)
          }
          if ($env:CHANGES_FILE -and $env:RELEASE_CONTENT_FILE) { throw 'Choose changes_file or release_content_file, not both.' }
          if ($env:RELEASE_MODE -eq 'submit') {
            if (-not $env:SUBMISSION_ID) { throw 'submission_id is required for submit.' }
            $arguments += @('--submission-id', $env:SUBMISSION_ID)
          }
          $metadataFile = if ($env:CHANGES_FILE) { $env:CHANGES_FILE } else { $env:RELEASE_CONTENT_FILE }
          if ($metadataFile) {
            if ([IO.Path]::IsPathRooted($metadataFile)) { throw 'Metadata file must be repository-relative.' }
            $changes = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE $metadataFile))
            $root = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\', '/') + [IO.Path]::DirectorySeparatorChar
            if (-not $changes.StartsWith($root, [StringComparison]::OrdinalIgnoreCase)) { throw 'Metadata file must stay inside the repository.' }
            if (-not (Test-Path -LiteralPath $changes -PathType Leaf)) { throw 'Metadata file is missing from this checkout.' }
            $metadataOption = if ($env:CHANGES_FILE) { '--changes' } else { '--release-content' }
            $arguments += @($metadataOption, $changes)
          } elseif ($env:RELEASE_MODE -eq 'edit') {
            throw 'edit requires changes_file or release_content_file.'
          }
          python @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Draft staging failed. Inspect the result receipt and Partner Center before retrying.' }
      - name: Report exact completion stage
        if: always()
        run: |
          $receipt = "$env:RUNNER_TEMP/store-draft/result.json"
          if (Test-Path -LiteralPath $receipt) {
            $result = Get-Content -Raw -LiteralPath $receipt | ConvertFrom-Json
            "Store operation: $($result.stage). Metadata saved: $($result.metadataSaved). Files transferred: $($result.filesTransferred). Submitted: $($result.submitted). Status: $($result.status)." >> $env:GITHUB_STEP_SUMMARY
            if ($result.submitted -eq $true) {
              'Store commit accepted; processing/certification status is reported by the submission status above.' >> $env:GITHUB_STEP_SUMMARY
            } else {
              'Store processing and certification were NOT started. API staging is not proof of a validated, portal-ready package. See docs/winui-store-release.md before editing an API-created draft in Partner Center.' >> $env:GITHUB_STEP_SUMMARY
            }
          } else {
            'No Store operation receipt was produced.' >> $env:GITHUB_STEP_SUMMARY
          }
      # Snapshots can contain private certification notes. Keep only a minimal receipt.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: winui-store-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/store-draft/result.json
          if-no-files-found: ignore
          retention-days: 14
